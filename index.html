<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Misi Pertolongan Cemas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column. A sticky strip at the top fills with bruise-healing colours as the pupil learns, then answers. Each lesson card is a manga-style comic panel (original characters, speech bubbles, halftone) plus a clear diagram or icon list and very short text. Primary buttons are shaped like a plaster. */
:root {
  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', system-ui, 'Segoe UI', sans-serif;
  --bg: #EDF3F8;
  --surface: #FFFFFF;
  --surface-2: #F4F8FB;
  --ink: #1B2A3B;
  --muted: #52647A;
  --line: #D6E0EA;
  --line-strong: #B5C4D4;
  --track: #DCE5EE;
  --accent: #6B3FA0;
  --on-accent: #FFFFFF;
  --ice: #DDF0F8;
  --plaster: #F0C39A;
  --plaster-ink: #2B1A0C;
  --good: #17794F;
  --good-bg: #E1F4EA;
  --bad: #C23A47;
  --bad-bg: #FBE6E8;
  --b1: #D9485B;
  --b2: #7B4BB5;
  --b3: #3F6FD0;
  --b4: #2E8B5C;
  --b5: #E3B93C;
  --skin-a: #F2CFB0;
  --skin-b: #EBB894;
  --skin-c: #F7E2CE;
  --bone: #EADFC9;
  --bone-2: #DCCFB2;
  --bone-line: #9C8F76;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1722;
    --surface: #182233;
    --surface-2: #1F2B3F;
    --ink: #E7EEF7;
    --muted: #9FB0C5;
    --line: #2A384D;
    --line-strong: #41546F;
    --track: #2A384D;
    --accent: #BFA2EE;
    --on-accent: #1B1030;
    --ice: #1E3A4C;
    --plaster: #E3B488;
    --good: #55C792;
    --good-bg: #183A2C;
    --bad: #FF8791;
    --bad-bg: #432127;
    --skin-a: #B88A68;
    --skin-b: #A87550;
    --skin-c: #8E6A50;
    --bone: #CFC6B2;
    --bone-2: #B9AE97;
    --bone-line: #6F6755;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1722;
  --surface: #182233;
  --surface-2: #1F2B3F;
  --ink: #E7EEF7;
  --muted: #9FB0C5;
  --line: #2A384D;
  --line-strong: #41546F;
  --track: #2A384D;
  --accent: #BFA2EE;
  --on-accent: #1B1030;
  --ice: #1E3A4C;
  --plaster: #E3B488;
  --good: #55C792;
  --good-bg: #183A2C;
  --bad: #FF8791;
  --bad-bg: #432127;
  --skin-a: #B88A68;
  --skin-b: #A87550;
  --skin-c: #8E6A50;
  --bone: #CFC6B2;
  --bone-2: #B9AE97;
  --bone-line: #6F6755;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 18px/1.55 var(--body);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
}
.wrap {
  width: 100%;
  max-width: 700px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header with healing strip */
.hdr {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 10px 12px;
}
.hdr-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 8px;
  font-size: .9rem;
}
.brand { font-family: var(--display); font-weight: 700; color: var(--accent); }
.stage { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.heal {
  position: relative;
  height: 12px;
  border-radius: 99px;
  overflow: hidden;
  background: linear-gradient(90deg, var(--b1), var(--b2), var(--b3), var(--b4), var(--b5));
}
.heal i {
  position: absolute;
  top: 0; bottom: 0; right: 0;
  width: 100%;
  background: var(--track);
  transition: width .45s ease;
}

main { padding-block: 22px 56px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: clamp(16px, 4.5vw, 26px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 9vw, 3rem); font-weight: 800; }
h2 { font-size: clamp(1.55rem, 6vw, 2rem); font-weight: 800; }
h3 { font-size: 1.25rem; font-weight: 700; }
h1:focus, h2:focus, .fb:focus { outline: none; }
p { margin: 0; max-width: 62ch; }
.eyebrow {
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.kw { font-weight: 700; color: var(--accent); }
.sub { color: var(--muted); }

/* Comic panels */
.comic { display: grid; gap: 12px; }
.pn {
  display: block;
  width: 100%;
  height: auto;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: #fff;
}

.facts { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.facts li { position: relative; padding-left: 26px; }
.facts li::before {
  content: "";
  position: absolute;
  left: 4px; top: .55em;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--accent);
}

.irows { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.irows li { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 14px; padding: 10px 14px 10px 10px; }
.irows li span { min-width: 0; }
.ic { flex: none; display: block; }

.note { background: var(--ice); border-radius: 16px; padding: 12px 16px; display: grid; gap: 2px; }
.note .lab { font-family: var(--display); font-weight: 700; font-size: 1rem; }

.fig { background: var(--surface-2); border-radius: 16px; padding: 12px; margin: 0; }
.fig svg { display: block; width: 100%; max-width: 440px; height: auto; margin-inline: auto; }
.fig svg text { font-family: var(--body); font-size: 13px; font-weight: 700; fill: var(--ink); }
.fig figcaption { text-align: center; font-size: .85rem; color: var(--muted); margin-top: 8px; }
.tog { margin: 10px auto 0; max-width: 360px; }

.strip { display: flex; border-radius: 12px; overflow: hidden; }
.strip span { flex: 1; text-align: center; padding: 9px 2px; font-size: .8rem; font-weight: 700; color: #fff; }
.strip span:last-child { color: #2B2208; }

/* Compare */
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.cmp-c { background: var(--surface-2); border-radius: 16px; padding: 14px; min-width: 0; display: grid; gap: 8px; justify-items: start; }
.cmp-c h3 { color: var(--accent); }
.cmp-c ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.cmp-c li { font-weight: 700; }

/* RICE cards */
.rice { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.rc {
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--surface-2);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  cursor: pointer;
  display: grid;
  gap: 8px;
  align-content: start;
  min-width: 0;
}
.rc:hover { border-color: var(--accent); }
.rc[aria-expanded="true"] { background: var(--ice); border-color: var(--accent); }
.rc .top { display: flex; align-items: center; gap: 12px; }
.rc .en { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: block; }
.rc .my { font: 700 1.35rem var(--display); line-height: 1.1; display: block; }
.rc .my b { color: var(--accent); }
.rc .more { font-size: 1rem; }
.rc .tap { font-size: .88rem; color: var(--muted); }
.count { font-weight: 700; color: var(--muted); font-size: .95rem; }

/* Buttons */
.btn {
  font: 700 1.1rem var(--display);
  border: 0;
  border-radius: 999px;
  padding: 13px 24px;
  min-height: 52px;
  cursor: pointer;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line-strong); }
.btn.ghost:hover:not(:disabled) { border-color: var(--accent); }
.btn.plaster {
  color: var(--plaster-ink);
  background:
    radial-gradient(circle, rgba(110, 60, 20, .3) 1.2px, transparent 1.9px) left top / 15% 9px repeat-y,
    radial-gradient(circle, rgba(110, 60, 20, .3) 1.2px, transparent 1.9px) right top / 15% 9px repeat-y,
    linear-gradient(90deg, transparent 15%, rgba(255, 255, 255, .38) 15% 85%, transparent 85%),
    var(--plaster);
  box-shadow: inset 0 0 0 2px rgba(110, 60, 20, .12);
}
.btn.plaster:hover:not(:disabled) { filter: brightness(1.04); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.nav { display: flex; gap: 12px; margin-top: 16px; }
.nav .plaster { flex: 1; }
.hint { margin-top: 14px; color: var(--muted); font-weight: 700; }

/* Quiz */
.qno { font-size: .85rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); }
.qtext { font-size: clamp(1.3rem, 5.2vw, 1.7rem); font-weight: 700; }
.tfq { font: 700 clamp(1.15rem, 4.6vw, 1.45rem)/1.3 var(--display); background: var(--surface-2); border-radius: 14px; padding: 14px 16px; }
.opts { display: grid; gap: 10px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line-strong);
  border-radius: 14px;
  padding: 12px 14px;
  min-height: 56px;
  cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; color: var(--ink); }
.opt .k {
  flex: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface-2);
  border: 2px solid var(--line-strong);
  font: 700 .95rem var(--display);
}
.opt.sel { border-color: var(--accent); background: var(--ice); }
.opt.sel .k { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.ok { border-color: var(--good); background: var(--good-bg); }
.opt.ok .k { background: var(--good); border-color: var(--good); color: var(--surface); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .k { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.dim { opacity: .6; }
.opts.two .opt { justify-content: center; text-align: center; font: 700 1.2rem var(--display); }
.opts.two .opt .k { display: none; }

.fb { border-radius: 16px; padding: 12px 16px 12px 12px; display: flex; align-items: center; gap: 12px; }
.fb > div { min-width: 0; display: grid; gap: 2px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--bad-bg); }
.fb strong { font: 800 1.25rem var(--display); }
.fb.good strong { color: var(--good); }
.fb.bad strong { color: var(--bad); }
.fb svg { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 3px solid #1B2A3B; background: #FFE3B8; }

/* Classify rows */
.rows { display: grid; gap: 10px; }
.row { background: var(--surface-2); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
.row.ok { border-color: var(--good); background: var(--good-bg); }
.row.bad { border-color: var(--bad); background: var(--bad-bg); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button {
  font: 700 1rem var(--display);
  color: var(--ink);
  background: var(--surface);
  border: 2px solid var(--line-strong);
  border-radius: 12px;
  padding: 10px 6px;
  min-height: 46px;
  cursor: pointer;
}
.seg button:hover:not(:disabled) { border-color: var(--accent); }
.seg button:disabled { cursor: default; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.row .ans { font-size: .92rem; font-weight: 700; color: var(--bad); }
.row.bad .seg button.on { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.row.ok .seg button.on { background: var(--good); border-color: var(--good); color: var(--surface); }

.ordtools { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn.small { min-height: 42px; padding: 8px 18px; font-size: .95rem; }

/* Start & result */
.parts { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.parts li { background: var(--surface-2); border-radius: 14px; padding: 10px 16px; display: grid; gap: 2px; }
.parts b { font: 700 1.1rem var(--display); color: var(--accent); }
.ring {
  --p: 0;
  width: 112px; aspect-ratio: 1;
  border-radius: 50%;
  display: grid; place-items: center;
  position: relative;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0);
  flex: none;
}
.ring::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; font: 800 1.9rem var(--display); font-variant-numeric: tabular-nums; }
.res { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.review { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.review li { background: var(--surface-2); border-radius: 14px; padding: 12px 16px; display: grid; gap: 4px; }
.review .qt { font-weight: 700; }
.review .ca { color: var(--good); font-weight: 700; }
.actions { display: grid; gap: 10px; margin-top: 4px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="ht" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="rgba(27,42,59,.16)"/></pattern>
    <radialGradient id="bruiseG"><stop offset="0" stop-color="#7B4BB5"/><stop offset="1" stop-color="#3F6FD0" stop-opacity=".6"/></radialGradient>
  </defs>
</svg>

<header class="hdr" id="hdr" hidden>
  <div class="wrap">
    <div class="hdr-row"><span class="brand">Misi Pertolongan Cemas</span><span class="stage" id="stage"></span></div>
    <div class="heal" id="heal" role="progressbar" aria-label="Kemajuan misi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="cover"></i></div>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
(function () {
  "use strict";

  var INK = "#1B2A3B";
  var FONT = "'Baloo 2','Trebuchet MS',sans-serif";

  /* ---------- Comic drawing helpers ---------- */
  function burst(cx, cy, r1, r2, n, fill) {
    var pts = [], i, r, a;
    for (i = 0; i < n * 2; i++) {
      r = i % 2 ? r1 : r2;
      a = Math.PI * i / n - Math.PI / 2;
      pts.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1));
    }
    return '<polygon points="' + pts.join(" ") + '" fill="' + (fill || "#FFD84A") + '" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
  }
  function focusLines(cx, cy, r1, r2, n) {
    var s = '<g stroke="rgba(27,42,59,.3)" stroke-width="2" stroke-linecap="round">', i, a;
    for (i = 0; i < n; i++) {
      a = Math.PI * 2 * i / n;
      s += '<line x1="' + (cx + r1 * Math.cos(a)).toFixed(1) + '" y1="' + (cy + r1 * Math.sin(a)).toFixed(1) + '" x2="' + (cx + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (cy + r2 * Math.sin(a)).toFixed(1) + '"/>';
    }
    return s + '</g>';
  }
  function sfx(cx, cy, txt, r, fill) {
    return focusLines(cx, cy, r + 6, r + 24, 14) + burst(cx, cy, r * 0.72, r, 9, fill) +
      '<text x="' + cx + '" y="' + (cy + r * 0.18) + '" text-anchor="middle" transform="rotate(-8 ' + cx + ' ' + cy + ')" font-family="' + FONT + '" font-weight="800" font-size="' + Math.round(r * 0.5) + '" fill="' + INK + '" stroke="none">' + txt + '</text>';
  }
  function star(cx, cy, r, fill) { return burst(cx, cy, r * 0.45, r, 5, fill || "#FFD84A"); }
  function bubble(x, y, w, lines, tx, ty) {
    var lh = 19, h = lines.length * lh + 12;
    var bx = Math.max(x + 18, Math.min(tx, x + w - 18));
    var s = '<path d="M' + (bx - 9) + ' ' + (y + h - 2) + ' L' + tx + ' ' + ty + ' L' + (bx + 9) + ' ' + (y + h - 2) + ' Z" fill="#fff" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/>';
    s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="14" fill="#fff" stroke="' + INK + '" stroke-width="3"/>';
    s += '<rect x="' + (bx - 8) + '" y="' + (y + h - 4) + '" width="16" height="6" fill="#fff"/>';
    lines.forEach(function (t, i) {
      s += '<text x="' + (x + w / 2) + '" y="' + (y + 2 + lh * (i + 1)) + '" text-anchor="middle" font-family="' + FONT + '" font-weight="700" font-size="15" fill="' + INK + '" stroke="none">' + t + '</text>';
    });
    return s;
  }

  function face(e) {
    var open = "#7A2230", s = "<g>";
    var eyes = '<g stroke="none"><ellipse cx="-13" cy="6" rx="6.5" ry="9" fill="' + INK + '"/><ellipse cx="13" cy="6" rx="6.5" ry="9" fill="' + INK + '"/>' +
      '<circle cx="-15.5" cy="2.5" r="2.8" fill="#fff"/><circle cx="10.5" cy="2.5" r="2.8" fill="#fff"/><circle cx="-10.5" cy="10" r="1.3" fill="#fff"/><circle cx="15.5" cy="10" r="1.3" fill="#fff"/></g>';
    var drop = '<path d="M33 -16 C37 -9 39 -5 35 -1 C31 -4 30 -9 33 -16 Z" fill="#8FD3F5" stroke-width="2"/>';
    if (e === "pain") {
      s += '<path d="M-23 -2 L-8 6 L-23 14" fill="none" stroke-width="3"/><path d="M23 -2 L8 6 L23 14" fill="none" stroke-width="3"/>' +
        '<path d="M-8 20 Q0 13 8 20 Q0 31 -8 20 Z" fill="' + open + '"/>' + drop;
    } else if (e === "happy") {
      s += '<path d="M-22 8 Q-13 -5 -4 8" fill="none" stroke-width="3"/><path d="M4 8 Q13 -5 22 8" fill="none" stroke-width="3"/>' +
        '<path d="M-9 17 Q0 33 9 17 Z" fill="' + open + '"/>';
    } else if (e === "worry") {
      s += eyes + '<path d="M-24 -8 L-7 -14 M24 -8 L7 -14" fill="none" stroke-width="3"/>' +
        '<path d="M-8 24 Q-4 19 0 24 Q4 29 8 24" fill="none" stroke-width="2.6"/>' + drop;
    } else {
      s += eyes + '<path d="M-7 20 Q0 28 7 20" fill="none" stroke-width="2.6"/>';
    }
    s += '<g stroke="none" opacity=".55"><ellipse cx="-23" cy="17" rx="6" ry="3.6" fill="#FF8FA3"/><ellipse cx="23" cy="17" rx="6" ry="3.6" fill="#FF8FA3"/></g>';
    return s + "</g>";
  }

  function person(o) {
    var k = o.k, e = o.e || "smile";
    var skin = k === "cikgu" ? "#EDBF9C" : "#F7D3B5";
    var shirt = k === "boy" ? "#3F6FD0" : (k === "girl" ? "#2E8B5C" : "#E4572E");
    var g = '<g transform="translate(' + o.x + ' ' + o.y + ') scale(' + (o.s || 1) + ')" stroke="' + INK + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">';
    g += '<path d="M-46 96 C-48 58 -28 44 0 44 C 28 44 48 58 46 96 Z" fill="' + shirt + '"/>';
    if (k === "cikgu") {

    function () {

    function () {

          (on ? '<span class="more">' + r.d + '</span>' : '<span class="tap">Tekan untuk buka</span>') +

      return '<p class="eyebrow">Pertolongan cemas</p><h2>Ingat RICE!</h2>' +

        '<div class="rice">' + cards + '</div>' +

    },
    function () {
      return '<p class="eyebrow">Keselamatan</p><h2>Jangan buat ini!</h2>' +
        '<div class="comic">' + SC.s6() + '</div>' +
        '<ul class="irows">' +
        '<li>' + icon("x", 38) + '<span>Jangan <b class="kw">urut</b> kawasan terseliuh.</span></li>' +
        '<li>' + icon("x", 38) + '<span>Jangan letak ais <b class="kw">terus</b> pada kulit.</span></li>' +
        '<li>' + icon("x", 38) + '<span>Jangan sambung bermain.</span></li></ul>' +
        '<h3>Beritahu guru jika</h3>' +
        '<ul class="irows">' +
        '<li>' + icon("warn", 38) + '<span>Sangat sakit, tidak boleh memijak.</span></li>' +
        '<li>' + icon("warn", 38) + '<span>Bengkak makin besar.</span></li>' +
        '<li>' + icon("warn", 38) + '<span>Jari kebas atau bertukar biru.</span></li></ul>' +
        '<div class="note"><span class="lab">Ingat</span><span>Sentiasa beritahu guru atau ibu bapa tentang kecederaan.</span></div>';
    },
    function () {
      return '<p class="eyebrow">Pencegahan</p><h2>Elak cedera lagi</h2>' +
        '<div class="comic">' + SC.s7() + '</div>' +
        '<ul class="irows">' +
        '<li>' + icon("warm", 44) + '<span><b class="kw">Panaskan badan</b> sebelum bersukan.</span></li>' +
        '<li>' + icon("shoe", 44) + '<span>Pakai <b class="kw">kasut yang sesuai</b>.</span></li>' +
        '<li>' + icon("slip", 44) + '<span>Jangan berlari di lantai licin.</span></li>' +
        '<li>' + icon("whistle", 44) + '<span>Ikut peraturan. Jangan bermain kasar.</span></li></ul>' +
        '<div class="note"><span class="lab">Sedia untuk kuiz?</span><span>Ada 10 soalan. Cuba dapat markah penuh!</span></div>';
    }
  ];

  /* ---------- Quiz content ---------- */
  var QUIZ = [
    { t: "mcq", q: "Apakah yang berlaku di bawah kulit apabila seseorang lebam?",
      o: ["Tulang menjadi patah", "Saluran darah kecil pecah dan darah bertakung", "Ligamen terkoyak", "Kulit terbakar"], a: 1,
      ex: "Saluran darah kecil pecah, jadi darah bertakung di bawah kulit." },
    { t: "tf", q: "Kulit yang lebam selalunya terkoyak dan berdarah.", v: false,
      ex: "Lebam ialah kecederaan tertutup. Tiada luka terbuka." },
    { t: "cls", q: "Lebam atau terseliuh? Pilih satu jawapan untuk setiap ayat.", labels: ["Lebam", "Terseliuh"],
      items: [
        { s: "Kulit berwarna biru keunguan", a: 0 },
        { s: "Ligamen di sendi tertarik", a: 1 },
        { s: "Sukar menggerakkan pergelangan kaki", a: 1 },
        { s: "Darah bertakung di bawah kulit", a: 0 }
      ],
      ex: "Lebam: kulit berwarna dan darah bertakung. Terseliuh: ligamen tertarik dan sendi sukar bergerak." },
    { t: "mcq", sc: "q4", q: "Aiman tergelincir. Buku lalinya bengkak dan dia sukar berdiri. Apakah kemungkinan kecederaannya?",
      o: ["Luka terbuka", "Lebam sahaja", "Terseliuh", "Demam"], a: 2,
      ex: "Bengkak dan sukar bergerak ialah tanda terseliuh." },
    { t: "ord", q: "Susun langkah RICE. Tekan langkah mengikut urutan yang betul.",
      items: ["Rehat: berhenti bergerak", "Ais: letak ais yang dibalut kain", "Balut: guna pembalut kenyal", "Tinggikan: letak di atas bantal"],
      disp: [1, 3, 0, 2],
      ex: "RICE: Rehat, Ais, Balut, Tinggikan." },
    { t: "mcq", q: "Berapa lama ais boleh diletakkan pada kawasan cedera pada satu-satu masa?",
      o: ["Kira-kira 15 hingga 20 minit", "Satu minit sahaja", "Tiga jam", "Sepanjang malam"], a: 0,
      ex: "Kira-kira 15 hingga 20 minit sudah cukup." },
    { t: "tf", q: "Ketulan ais boleh diletakkan terus pada kulit.", v: false,
      ex: "Ais terus boleh mencederakan kulit. Balut dengan kain dahulu." },
    { t: "mcq", sc: "q8", q: "Kawan kamu terseliuh semasa PJ. Apakah tindakan pertama yang betul?",
      o: ["Suruh dia berlari supaya sakit hilang", "Suruh dia berhenti dan berehat, kemudian beritahu guru", "Urut kakinya dengan kuat", "Biarkan dia terus bermain"], a: 1,
      ex: "Rehat dahulu. Selepas itu beritahu guru." },
    { t: "mcq", q: "Mengapakah bahagian yang cedera perlu ditinggikan?",
      o: ["Supaya kelihatan cantik", "Supaya boleh berlari lebih laju", "Supaya lebih sakit", "Untuk mengurangkan bengkak"], a: 3,
      ex: "Kedudukan yang lebih tinggi membantu mengurangkan bengkak." },
    { t: "ms", q: "Pilih semua cara untuk mencegah lebam dan terseliuh.",
      o: [
        { s: "Panaskan badan sebelum bersukan", ok: true },
        { s: "Berlari di lantai yang licin", ok: false },
        { s: "Pakai kasut yang sesuai", ok: true },
        { s: "Bermain kasar dengan kawan", ok: false },
        { s: "Ikut peraturan permainan", ok: true }
      ],
      ex: "Panaskan badan, pakai kasut sesuai dan ikut peraturan." }
  ];
  QUIZ.forEach(function (q) {
    if (q.t === "tf") { q.t = "mcq"; q.o = ["Betul", "Salah"]; q.a = q.v ? 0 : 1; q.tf = true; }
  });

  var PRAISE = ["Betul!", "Hebat!", "Tepat sekali!", "Bagus!"];
  var AVA = ["girl", "cikgu", "boy"];
  var LET = "ABCD";

  /* ---------- State ---------- */
  var S = { screen: "start", w: 0, q: 0, score: 0, log: [], rice: [false, false, false, false], bru: 1, ank: 1, ui: null, fb: null };
  var $app = document.getElementById("app");
  var $hdr = document.getElementById("hdr");
  var $stage = document.getElementById("stage");
  var $cover = document.getElementById("cover");
  var $heal = document.getElementById("heal");
  var TOTAL_W = STEPS.length, TOTAL_Q = QUIZ.length, TOTAL = TOTAL_W + TOTAL_Q;

  function initUi(i) {
    var q = QUIZ[i];
    if (q.t === "cls") return { vals: q.items.map(function () { return null; }) };
    if (q.t === "ord") return { seq: [] };
    if (q.t === "ms") return { sel: q.o.map(function () { return false; }) };
    return { pick: null };
  }

  function setHeader() {
    if (S.screen === "start") { $hdr.hidden = true; return; }
    $hdr.hidden = false;
    var done, label;
    if (S.screen === "walk") {
      done = S.w + 1;
      label = "Belajar · " + (S.w + 1) + " / " + TOTAL_W;
    } else if (S.screen === "quiz") {
      done = TOTAL_W + S.q + (S.fb ? 1 : 0);
      label = "Kuiz · " + (S.q + 1) + " / " + TOTAL_Q + " · Markah " + S.score;
    } else {
      done = TOTAL;
      label = "Selesai · Markah " + S.score + " / " + TOTAL_Q;
    }
    var pct = Math.round(done / TOTAL * 100);
    $stage.textContent = label;
    $cover.style.width = (100 - pct) + "%";
    $heal.setAttribute("aria-valuenow", String(pct));
  }

  /* ---------- Views ---------- */
  function viewStart() {
    return '<section class="card">' +
      '<div class="comic">' + SC.cover() + '</div>' +
      '<p class="eyebrow">Pendidikan Kesihatan · Tahun 4</p>' +
      '<h1>Misi Pertolongan Cemas</h1>' +
      '<p>Topik: <b class="kw">lebam dan terseliuh</b>. Aiman jatuh semasa PJ. Jom bantu dia!</p>' +
      '<ol class="parts">' +
      '<li><b>Bahagian 1 · Belajar</b><span>' + TOTAL_W + ' kad komik ringkas.</span></li>' +
      '<li><b>Bahagian 2 · Kuiz</b><span>' + TOTAL_Q + ' soalan. Cuba dapat markah penuh!</span></li>' +
      '</ol>' +
      '<div class="actions"><button class="btn plaster" data-act="start">Mula misi</button></div>' +
      '<p class="sub">Sentiasa beritahu guru atau ibu bapa jika ada yang cedera.</p>' +
      '</section>';
  }

  function viewWalk() {
    var last = S.w === TOTAL_W - 1;
    return '<article class="card">' + STEPS[S.w]() + '</article>' +
      '<div class="nav"><button class="btn ghost" data-act="back">Kembali</button>' +
      '<button class="btn plaster" data-act="next">' + (last ? "Mula kuiz" : "Seterusnya") + '</button></div>';
  }

  function optBtn(cls, key, text, i, disabled) {
    return '<button class="opt ' + cls + '" data-act="pick" data-i="' + i + '"' + (disabled ? " disabled" : "") + '><span class="k">' + key + '</span><span>' + text + '</span></button>';
  }

  function viewQuiz() {
    var q = QUIZ[S.q], u = S.ui, done = !!S.fb, body = "", ready = false, needsCheck = true;

    if (q.t === "mcq") {
      needsCheck = false;
      var opts = q.o.map(function (txt, i) {
        var cls = "", key = q.tf ? "" : LET.charAt(i);
        if (done) {
          if (i === q.a) { cls = "ok"; key = "✓"; }
          else if (i === u.pick) { cls = "bad"; key = "✕"; }
          else cls = "dim";
        }
        return optBtn(cls, key, txt, i, done);
      }).join("");
      body = (q.tf ? '<p class="eyebrow">Betul atau salah?</p><p class="tfq">“' + q.q + '”</p>' : '<h2 class="qtext">' + q.q + '</h2>') +
        '<div class="opts' + (q.tf ? " two" : "") + '">' + opts + '</div>';
    }

    if (q.t === "cls") {
      ready = u.vals.every(function (v) { return v !== null; });
      var rows = q.items.map(function (it, i) {
        var rc = "";
        if (done) rc = u.vals[i] === it.a ? "ok" : "bad";
        var seg = q.labels.map(function (lab, j) {
          return '<button data-act="cls" data-i="' + i + '" data-j="' + j + '" class="' + (u.vals[i] === j ? "on" : "") + '"' + (done ? " disabled" : "") + '>' + lab + '</button>';
        }).join("");
        var ans = (done && rc === "bad") ? '<span class="ans">Jawapan betul: ' + q.labels[it.a] + '</span>' : "";
        return '<div class="row ' + rc + '"><span>' + it.s + '</span><div class="seg">' + seg + '</div>' + ans + '</div>';
      }).join("");
      body = '<h2 class="qtext">' + q.q + '</h2><div class="rows">' + rows + '</div>';
    }

    if (q.t === "ord") {
      ready = u.seq.length === q.items.length;
      var ob = q.disp.map(function (idx) {
        var pos = u.seq.indexOf(idx), cls = "", key = "";
        if (pos >= 0) { cls = "sel"; key = String(pos + 1); }
        if (done) {
          if (pos === idx) { cls = "ok"; key = "✓"; } else { cls = "bad"; key = "✕"; }
        }
        return '<button class="opt ' + cls + '" data-act="ord" data-i="' + idx + '"' + (done ? " disabled" : "") + '><span class="k">' + key + '</span>' + icon(RICE_ICO[idx], 38) + '<span>' + q.items[idx] + '</span></button>';
      }).join("");
      body = '<h2 class="qtext">' + q.q + '</h2><div class="opts">' + ob + '</div>' +
        (done ? "" : '<div class="ordtools"><span class="count">Dipilih: ' + u.seq.length + ' / ' + q.items.length + '</span><button class="btn ghost small" data-act="ordreset"' + (u.seq.length ? "" : " disabled") + '>Mula semula</button></div>');
    }

    if (q.t === "ms") {
      ready = u.sel.some(Boolean);
      var mb = q.o.map(function (o, i) {
        var cls = u.sel[i] ? "sel" : "", key = u.sel[i] ? "✓" : "";
        if (done) {
          if (o.ok) { cls = "ok"; key = "✓"; }
          else if (u.sel[i]) { cls = "bad"; key = "✕"; }
          else { cls = "dim"; key = ""; }
        }
        return '<button class="opt ' + cls + '" data-act="ms" data-i="' + i + '" aria-pressed="' + u.sel[i] + '"' + (done ? " disabled" : "") + '><span class="k">' + key + '</span><span>' + o.s + '</span></button>';
      }).join("");
      body = '<h2 class="qtext">' + q.q + '</h2><p class="sub">Boleh pilih lebih daripada satu.</p><div class="opts">' + mb + '</div>';
    }

    var scene = q.sc ? '<div class="comic">' + SC[q.sc]() + '</div>' : "";

    var fb = "";
    if (done) {
      fb = '<div class="fb ' + (S.fb.ok ? "good" : "bad") + '" role="status" tabindex="-1">' + avatar(AVA[S.q % 3], S.fb.ok ? "happy" : "worry") +
        '<div><strong>' + S.fb.title + '</strong><p>' + S.fb.text + '</p></div></div>';
    }

    var nav = "";
    if (done) {
      nav = '<div class="nav"><button class="btn plaster" data-act="qnext">' + (S.q === TOTAL_Q - 1 ? "Lihat keputusan" : "Soalan seterusnya") + '</button></div>';
    } else if (needsCheck) {
      nav = '<div class="nav"><button class="btn plaster" data-act="check"' + (ready ? "" : " disabled") + '>Semak jawapan</button></div>';
    } else {
      nav = '<p class="hint">Pilih satu jawapan.</p>';
    }

    return '<article class="card"><p class="qno">Soalan ' + (S.q + 1) + ' daripada ' + TOTAL_Q + '</p>' + scene + body + fb + '</article>' + nav;
  }

  function correctText(q) {
    if (q.t === "mcq") return q.o[q.a];
    if (q.t === "cls") return q.items.map(function (it) { return it.s + " → " + q.labels[it.a]; }).join("; ");
    if (q.t === "ord") return q.items.map(function (s) { return s.split(":")[0]; }).join(" → ");
    return q.o.filter(function (o) { return o.ok; }).map(function (o) { return o.s; }).join("; ");
  }

  function viewResult() {
    var sc = S.score, tier, msg, scn;
    if (sc >= 9) { tier = "Pembantu Cemas Hebat!"; msg = "Kamu tahu cara membantu kawan yang cedera."; scn = "resA"; }
    else if (sc >= 6) { tier = "Hampir hebat!"; msg = "Baca semula bahagian yang tersilap, kemudian cuba lagi."; scn = "resB"; }
    else { tier = "Teruskan berlatih!"; msg = "Baca semula kad pelajaran dan cuba lagi."; scn = "resC"; }
    var wrong = QUIZ.map(function (q, i) { return { q: q, i: i }; }).filter(function (x) { return !(S.log[x.i] && S.log[x.i].ok); });
    var review = "";
    if (wrong.length) {
      review = '<h3>Semak semula</h3><ul class="review">' + wrong.map(function (x) {
        var title = x.q.tf ? "“" + x.q.q + "”" : x.q.q;
        return '<li><span class="qt">Soalan ' + (x.i + 1) + ': ' + title + '</span><span class="ca">' + correctText(x.q) + '</span><span>' + x.q.ex + '</span></li>';
      }).join("") + '</ul>';
    } else {
      review = '<div class="note"><span class="lab">Markah penuh!</span><span>Tiada soalan yang tersilap. Kongsi ilmu ini dengan kawan.</span></div>';
    }
    return '<section class="card"><p class="eyebrow">Keputusan</p>' +
      '<div class="comic">' + SC[scn]() + '</div>' +
      '<div class="res"><div class="ring" style="--p:' + (sc * 10) + '" role="img" aria-label="Markah ' + sc + ' daripada ' + TOTAL_Q + '"><span>' + sc + '/' + TOTAL_Q + '</span></div>' +
      '<div><h2>' + tier + '</h2><p>' + msg + '</p></div></div>' + review +
      '<div class="actions"><button class="btn plaster" data-act="again">Cuba kuiz lagi</button><button class="btn ghost" data-act="reread">Baca semula pelajaran</button></div>' +
      '</section>';
  }

  /* ---------- Render ---------- */
  function render(mode) {
    setHeader();
    var html = "";
    if (S.screen === "start") html = viewStart();
    else if (S.screen === "walk") html = viewWalk();
    else if (S.screen === "quiz") html = viewQuiz();
    else html = viewResult();
    $app.innerHTML = html;
    if (mode === "top") {
      window.scrollTo(0, 0);
      var h = $app.querySelector("h1, h2");
      if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
    } else if (mode === "fb") {
      var f = $app.querySelector(".fb");
      if (f) { f.focus({ preventScroll: true }); f.scrollIntoView({ block: "nearest" }); }
    }
  }

  /* ---------- Quiz logic ---------- */
  function startQuiz() {
    S.screen = "quiz"; S.q = 0; S.score = 0; S.log = []; S.fb = null; S.ui = initUi(0);
  }

  function finish(ok, text) {
    var title = ok ? PRAISE[S.q % PRAISE.length] : "Belum tepat";
    S.fb = { ok: ok, title: title, text: text };
    if (ok) S.score++;
    S.log[S.q] = { ok: ok };
    render("fb");
  }

  function answerMcq(i) {
    var q = QUIZ[S.q];
    S.ui.pick = i;
    var ok = i === q.a;
    finish(ok, (ok ? "" : "Jawapan yang betul: <b>" + q.o[q.a] + "</b>. ") + q.ex);
  }

  function check() {
    var q = QUIZ[S.q], u = S.ui, ok;
    if (q.t === "cls") {
      ok = q.items.every(function (it, i) { return u.vals[i] === it.a; });
      finish(ok, (ok ? "" : "Lihat jawapan betul pada baris yang bertanda. ") + q.ex);
    } else if (q.t === "ord") {
      ok = u.seq.every(function (v, i) { return v === i; });
      finish(ok, (ok ? "" : "Susunan betul: <b>Rehat → Ais → Balut → Tinggikan</b>. ") + q.ex);
    } else if (q.t === "ms") {
      ok = q.o.every(function (o, i) { return o.ok === u.sel[i]; });
      finish(ok, (ok ? "" : "Pilihan berwarna hijau ialah jawapan yang betul. ") + q.ex);
    }
  }

  function qnext() {
    if (S.q < TOTAL_Q - 1) { S.q++; S.fb = null; S.ui = initUi(S.q); render("top"); }
    else { S.screen = "result"; S.fb = null; render("top"); }
  }

  /* ---------- Events ---------- */
  $app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b || b.disabled) return;
    var a = b.getAttribute("data-act");
    var i = parseInt(b.getAttribute("data-i"), 10);
    var j = parseInt(b.getAttribute("data-j"), 10);

    if (a === "start") { S.screen = "walk"; S.w = 0; render("top"); }
    else if (a === "back") {
      if (S.w === 0) S.screen = "start"; else S.w--;
      render("top");
    }
    else if (a === "next") {
      if (S.w < TOTAL_W - 1) S.w++; else startQuiz();
      render("top");
    }
    else if (a === "rice") { S.rice[i] = !S.rice[i]; render("keep"); }
    else if (a === "bru") { S.bru = i; render("keep"); }
    else if (a === "ank") { S.ank = i; render("keep"); }
    else if (a === "pick") { if (!S.fb) answerMcq(i); }
    else if (a === "cls") { if (!S.fb) { S.ui.vals[i] = j; render("keep"); } }
    else if (a === "ord") { if (!S.fb && S.ui.seq.indexOf(i) < 0) { S.ui.seq.push(i); render("keep"); } }
    else if (a === "ordreset") { S.ui.seq = []; render("keep"); }
    else if (a === "ms") { if (!S.fb) { S.ui.sel[i] = !S.ui.sel[i]; render("keep"); } }
    else if (a === "check") { if (!S.fb) check(); }
    else if (a === "qnext") qnext();
    else if (a === "again") { startQuiz(); render("top"); }
    else if (a === "reread") { S.screen = "walk"; S.w = 0; render("top"); }
  });

  render();
})();
</script>
